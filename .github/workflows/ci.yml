name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: software/app
      - name: Lint (all prek hooks)
        run: nix develop -c just lint
      - name: Test
        run: nix develop -c just test
      - name: Security advisories
        run: nix develop -c cargo deny --manifest-path software/app/Cargo.toml check advisories
  image:
    name: Build image
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build bootc image
        run: nix develop -c just image
